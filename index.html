@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
:root{--n:#001f3f;--n2:#063763;--o:#ff7a00;--o2:#ff9f1c;--bg:#f4f7fb;--t:#071d49;--m:#64748b;--line:#dbe4f0;--g:#22c55e;--r:#ef4444;--y:#f59e0b;--blue:#2563eb}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--t)}button,input,select,textarea{font:inherit}button{cursor:pointer}.btn{border:0;border-radius:14px;padding:13px 16px;font-weight:900}.primary{background:var(--n);color:white}.orange{background:var(--o);color:white}.light{background:white;color:var(--n);border:1px solid #cbd5e1}.danger{background:#fee2e2;color:#991b1b}.w-full{width:100%}.mt{margin-top:16px}.input{width:100%;border:1px solid #cbd5e1;border-radius:14px;padding:12px;margin-top:6px;background:white}.label{display:block;font-size:12px;font-weight:900;margin-top:14px;color:var(--m);text-transform:uppercase}.login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--n),#003b78);padding:18px}.login-box{background:white;border-radius:28px;padding:28px;width:min(470px,100%);box-shadow:0 24px 70px #0005}.logo{display:block;max-width:210px;max-height:110px;margin:0 auto 16px;object-fit:contain}.badge{display:inline-block;background:#dcfce7;color:#166534;border-radius:999px;padding:7px 12px;font-size:12px;font-weight:900}.shell{display:grid;grid-template-columns:285px 1fr;min-height:100vh}.side{background:linear-gradient(180deg,var(--n),#002b55);color:white;padding:20px;position:sticky;top:0;height:100vh;overflow:auto}.side-logo{background:white;border-radius:18px;padding:12px;margin-bottom:18px;text-align:center}.side-logo img{max-width:210px;max-height:105px;object-fit:contain}.side button{display:block;width:100%;text-align:left;background:transparent;color:white;border:0;padding:14px;border-radius:14px;font-weight:900;margin:5px 0}.side button:hover,.side button.active{background:var(--o)}.top{min-height:78px;background:white;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between;padding:12px 24px;position:sticky;top:0;z-index:10}.content{padding:24px}.hero{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;margin-bottom:18px}.actions{display:flex;gap:8px;flex-wrap:wrap}.grid{display:grid;gap:16px}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.card{background:white;border:1px solid #e1e8f2;border-radius:22px;padding:20px;box-shadow:0 8px 24px #0f172a12}.kpi{font-size:34px;font-weight:900}.muted{color:var(--m)}.pill{display:inline-block;border-radius:999px;padding:5px 10px;font-size:11px;font-weight:900;background:#eff6ff;color:#1d4ed8}.crit{background:#fee2e2;color:#991b1b}.alta{background:#ffedd5;color:#9a3412}.media{background:#eff6ff;color:#1d4ed8}.baixa{background:#dcfce7;color:#166534}.ok{background:#dcfce7;color:#166534}.warn{background:#fef3c7;color:#92400e}.os{border-left:7px solid var(--blue)}.os.critica{border-left-color:var(--r)}.dot{width:12px;height:12px;border-radius:50%;display:inline-block;margin-right:8px}.green{background:var(--g)}.yellow{background:var(--y)}.red{background:var(--r)}.filters{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.filters .input{margin:0;min-width:150px;flex:1}.modal-bg{position:fixed;inset:0;background:#001f3f99;display:flex;align-items:center;justify-content:center;padding:16px;z-index:100}.modal{background:white;border-radius:24px;padding:22px;width:min(820px,100%);max-height:92vh;overflow:auto}.modal-head{display:flex;justify-content:space-between;gap:10px;align-items:center}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.check{border:1px solid var(--line);border-radius:16px;padding:12px;margin:10px 0}.choice{border:1px solid #cbd5e1;background:white;border-radius:99px;padding:8px 12px;font-weight:900}.choice.active.okc{background:#dcfce7;color:#166534}.choice.active.noc{background:#fee2e2;color:#991b1b}.hidden{display:none}.photo-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.photo-btn{position:relative;overflow:hidden}.photo-btn input{position:absolute;inset:0;opacity:0;cursor:pointer}.preview{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.preview img{width:76px;height:76px;border-radius:12px;object-fit:cover;border:1px solid #ddd}.photo-box{border:2px dashed #cbd5e1;border-radius:18px;padding:24px;text-align:center;color:var(--m);background:#f8fafc}.empty{text-align:center;padding:26px;border:1px dashed #cbd5e1;border-radius:18px;color:var(--m);background:#f8fafc}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:12px;border-bottom:1px solid #e5e7eb;text-align:left;font-size:14px}.table th{font-size:12px;text-transform:uppercase;color:var(--m)}.toast{position:fixed;right:16px;bottom:16px;background:var(--n);color:white;padding:12px 16px;border-radius:14px;font-weight:900;z-index:200}.sync{font-size:12px;color:#166534;background:#dcfce7;padding:6px 10px;border-radius:999px;font-weight:900}.bottom{display:none}.loading{min-height:100vh;display:flex;align-items:center;justify-content:center;font-weight:900}
@media(max-width:900px){.shell{display:block}.side{display:none}.top{min-height:70px;padding:12px}.content{padding:16px 16px 84px}.hero{display:block}.actions button{width:100%;margin-top:8px}.g4,.g3,.g2,.formgrid{grid-template-columns:1fr}.filters{display:grid}.photo-actions{grid-template-columns:1fr}.bottom{display:flex;position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #ddd;z-index:50;padding-bottom:env(safe-area-inset-bottom)}.bottom button{flex:1;border:0;background:white;color:var(--n);padding:10px 4px;font-weight:900;font-size:11px}}

let currentUser=null,currentProfile=null,unitId=null,currentRoute="dashboard",lastRefresh=0;
let equipment=[],sectors=[],areas=[],orders=[],preventives=[],profiles=[];
let osFiles=[],prevFiles=[];

function esc(v){return String(v??"").replace(/[&<>"']/g,s=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[s]))}
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
function closeModal(){document.getElementById("modalRoot").innerHTML=""}
function priorityClass(p){return p==="CRITICA"?"crit":p==="ALTA"?"alta":p==="MEDIA"?"media":"baixa"}
function peso(p){return {BAIXA:1,MEDIA:2,ALTA:3,CRITICA:4}[p]||0}
function equipmentName(id){return equipment.find(e=>e.id===id)?.nome||"Sem equipamento"}
function sectorName(id){return sectors.find(s=>s.id===id)?.nome||"Não informado"}
function areaName(id){return areas.find(a=>a.id===id)?.nome||"Não informada"}
function logo(){return `<img src="${LOGO}" class="logo" alt="Entre Amigos">`}

async function bootstrap(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){renderLogin();return}
  currentUser=session.user;
  await loadProfile();
  await loadBase();
  renderApp();
  startSync();
}
async function loadProfile(){
  const {data,error}=await sb.from("perfis").select("*").eq("id",currentUser.id).single();
  if(error)throw new Error("Perfil não encontrado: "+error.message);
  currentProfile=data;
}
async function loadBase(){
  const {data:u,error:uerr}=await sb.from("unidades").select("id,nome").eq("nome","RioMar Recife").single();
  if(uerr)throw new Error("Unidade RioMar Recife não encontrada.");
  unitId=u.id;
  const [eqRes,secRes,areaRes,osRes,prevRes,profRes]=await Promise.all([
    sb.from("equipamentos").select("*").eq("unidade_id",unitId).eq("ativo",true).order("nome"),
    sb.from("setores").select("*").eq("unidade_id",unitId).eq("ativo",true).order("nome"),
    sb.from("areas").select("*").eq("unidade_id",unitId).eq("ativo",true).order("nome"),
    sb.from("ordens_servico").select("*").eq("unidade_id",unitId).order("data_abertura",{ascending:false}),
    sb.from("preventivas_agendamentos").select("*").eq("unidade_id",unitId).order("data_programada",{ascending:true}),
    sb.from("perfis").select("id,nome,email,role,ativo,unidade_id").or(`unidade_id.eq.${unitId},role.in.(MASTER,ADMIN,DIRETOR)`).order("nome")
  ]);
  [eqRes,secRes,areaRes,osRes,prevRes,profRes].forEach(r=>{if(r.error)console.warn(r.error)});
  equipment=eqRes.data||[];sectors=secRes.data||[];areas=areaRes.data||[];orders=osRes.data||[];preventives=prevRes.data||[];profiles=profRes.data||[];
  lastRefresh=Date.now();
}
function startSync(){
  setInterval(async()=>{if(document.hidden)return;try{await loadBase();renderPage(currentRoute)}catch(e){console.warn(e)}},12000);
  try{
    sb.channel("ea-riomar-sync")
      .on("postgres_changes",{event:"*",schema:"public",table:"ordens_servico",filter:`unidade_id=eq.${unitId}`},async()=>{await loadBase();renderPage(currentRoute)})
      .on("postgres_changes",{event:"*",schema:"public",table:"equipamentos",filter:`unidade_id=eq.${unitId}`},async()=>{await loadBase();renderPage(currentRoute)})
      .on("postgres_changes",{event:"*",schema:"public",table:"preventivas_agendamentos",filter:`unidade_id=eq.${unitId}`},async()=>{await loadBase();renderPage(currentRoute)})
      .subscribe();
  }catch(e){console.warn("Realtime indisponível; usando atualização automática.",e)}
}
function renderLogin(){
  document.getElementById("app").innerHTML=`<div class="login"><div class="login-box">${logo()}<span class="badge">Sistema sincronizado • Supabase</span><h1>Login</h1><p>Use o mesmo usuário nos dois celulares.</p><form id="loginForm"><label class="label">E-mail</label><input class="input" name="email" type="email" value="deivde@restauranteentreamigos.com.br" required><label class="label">Senha</label><input class="input" name="senha" type="password" required><button class="btn primary w-full mt">Entrar</button></form><p class="muted" style="font-size:13px">Os dados serão compartilhados entre iPhone, Android e computador.</p></div></div>`;
  document.getElementById("loginForm").onsubmit=async e=>{
    e.preventDefault();const b=e.target.querySelector("button");b.disabled=true;b.textContent="Entrando...";
    const {error}=await sb.auth.signInWithPassword({email:e.target.email.value.trim(),password:e.target.senha.value});
    if(error){alert(error.message);b.disabled=false;b.textContent="Entrar";return}
    location.reload();
  };
}
function menu(){
  return [["⌂","Dashboard","dashboard"],["➕","Abrir chamado","abrir"],["📋","Ocorrências","ordens"],["🏭","Equipamentos","equip"],["📅","Preventivas","prev"],["👥","Usuários","users"],["📊","Relatórios","rel"]];
}
function renderApp(){
  const m=menu();
  document.getElementById("app").innerHTML=`<div class="shell"><aside class="side"><div class="side-logo"><img src="${LOGO}"></div><small>RioMar Recife • Produção</small><p>${esc(currentProfile.nome)}<br><b>${esc(currentProfile.role)}</b></p>${m.map(x=>`<button data-r="${x[2]}">${x[0]} ${x[1]}</button>`).join("")}</aside><main><div class="top"><div><b>Plataforma de Manutenção Entre Amigos</b><br><small>Unidade: RioMar Recife</small></div><div><span class="sync">● Sincronizado</span> <button id="logout" class="btn light">Sair</button></div></div><section class="content" id="content"></section></main><div class="bottom">${m.slice(0,4).map(x=>`<button data-r="${x[2]}"><div>${x[0]}</div>${x[1]}</button>`).join("")}</div></div>`;
  document.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>navigate(b.dataset.r));
  document.getElementById("logout").onclick=async()=>{await sb.auth.signOut();location.reload()};
  renderPage(currentRoute);
}
function navigate(r){currentRoute=r;renderPage(r);window.scrollTo(0,0)}
function renderPage(r){
  const c=document.getElementById("content");if(!c)return;
  document.querySelectorAll("[data-r]").forEach(b=>b.classList.toggle("active",b.dataset.r===r));
  c.innerHTML=r==="dashboard"?dashboard():r==="abrir"?abrir():r==="ordens"?ordensPage():r==="equip"?equipPage():r==="prev"?prevPage():r==="users"?usersPage():reportsPage();
  bindPage(r);
}
function kpi(t,v,s,r){return `<div class="card" ${r?`data-r="${r}" style="cursor:pointer"`:""}><div class="muted">${t}</div><div class="kpi">${v}</div><small>${s}</small></div>`}
function dashboard(){
  const open=orders.filter(o=>o.status!=="CONCLUIDA"),critical=open.filter(o=>o.prioridade==="CRITICA"),attention=equipment.filter(e=>e.status!=="OPERACIONAL"),scheduled=preventives.filter(p=>p.status==="AGENDADA"||p.status==="ATRASADA");
  const pri=[...open].sort((a,b)=>peso(b.prioridade)-peso(a.prioridade)).slice(0,4);
  return `<div class="hero"><div><h1>Dashboard RioMar Recife</h1><p>Dados compartilhados em tempo real entre os aparelhos.</p></div><div class="actions"><button class="btn orange" data-r="abrir">+ Abrir chamado</button><button class="btn light" data-r="equip">+ Equipamento</button><button class="btn light" data-r="prev">+ Preventiva</button></div></div><div class="grid g4">${kpi("OS abertas",open.length,"Em andamento","ordens")}${kpi("Críticas",critical.length,"Ação imediata","ordens")}${kpi("Equip. atenção",attention.length,"Manutenção/parado","equip")}${kpi("Preventivas",scheduled.length,"Programadas","prev")}</div><div class="grid g3 mt"><div class="card"><h2>Painel Operacional</h2>${statusLine("Salão","green","Operando")}${statusLine("Bar",open.some(o=>sectorName(o.setor_id)==="Bar")?"yellow":"green",open.some(o=>sectorName(o.setor_id)==="Bar")?"Chamado aberto":"Operando")}${statusLine("Cozinha","green","Operando")}${statusLine("Sushi",critical.some(o=>sectorName(o.setor_id).includes("Sushi"))?"red":"green",critical.some(o=>sectorName(o.setor_id).includes("Sushi"))?"Atenção crítica":"Operando")}</div><div class="card"><h2>Ocorrências prioritárias</h2>${pri.length?pri.map(orderMini).join(""):'<div class="empty">Nenhuma OS aberta.</div>'}</div><div class="card"><h2>Sincronização</h2><p>Cadastros feitos no Android aparecem no iPhone e vice-versa.</p><p><b>Última atualização:</b><br>${new Date(lastRefresh).toLocaleTimeString("pt-BR")}</p><button class="btn light w-full" id="refresh">Atualizar agora</button></div></div>`;
}
function statusLine(n,c,s){return `<p><span class="dot ${c}"></span><b>${n}</b><span style="float:right">${s}</span></p>`}
function orderMini(o){return `<div class="card os ${o.prioridade==="CRITICA"?"critica":""}" style="box-shadow:none;margin-bottom:10px;padding:14px"><b>${esc(equipmentName(o.equipamento_id))}</b><p>${esc(o.descricao)}</p><span class="pill ${priorityClass(o.prioridade)}">${o.prioridade}</span> <span class="pill">${o.status}</span></div>`}
function abrir(){
  return `<div class="hero"><div><h1>Abrir chamado</h1><p>A OS ficará disponível em todos os aparelhos.</p></div></div><div class="card"><form id="osForm"><div class="formgrid"><div><label class="label">Categoria</label><select class="input" name="categoria"><option>Equipamento</option><option>Elétrica</option><option>Hidráulica</option><option>Estrutural</option><option>Limpeza</option><option>Segurança</option></select></div><div><label class="label">Equipamento</label><select class="input" name="equipamento_id"><option value="">Não se aplica</option>${equipment.map(e=>`<option value="${e.id}">${esc(e.nome)}</option>`).join("")}</select></div><div><label class="label">Prioridade</label><select class="input" name="prioridade"><option value="BAIXA">Baixa - 5 dias</option><option value="MEDIA" selected>Média - 3 dias</option><option value="ALTA">Alta - 1 dia</option><option value="CRITICA">Crítica - 4 horas</option></select></div><div><label class="label">Problema</label><input class="input" name="problema" placeholder="Ex: vazamento, não liga, ruído"></div></div><label class="label">Descrição</label><textarea class="input" name="descricao" required></textarea><button class="btn primary w-full mt">Enviar chamado</button></form></div>`;
}
function ordersFiltered(){
  const q=(document.getElementById("qOS")?.value||"").toLowerCase(),s=document.getElementById("sOS")?.value||"",p=document.getElementById("pOS")?.value||"";
  return orders.filter(o=>(!q||(equipmentName(o.equipamento_id)+" "+o.descricao).toLowerCase().includes(q))&&(!s||o.status===s)&&(!p||o.prioridade===p)).sort((a,b)=>peso(b.prioridade)-peso(a.prioridade));
}
function ordensPage(){
  return `<div class="hero"><div><h1>Ocorrências / OS</h1><p>Fila sincronizada entre todos os usuários.</p></div><button class="btn orange" data-r="abrir">+ Nova OS</button></div><div class="filters"><input id="qOS" class="input" placeholder="Buscar"><select id="sOS" class="input"><option value="">Todos os status</option><option>ABERTA</option><option>EM_EXECUCAO</option><option>AGUARDANDO_PECA</option><option>CONCLUIDA</option></select><select id="pOS" class="input"><option value="">Todas as prioridades</option><option>CRITICA</option><option>ALTA</option><option>MEDIA</option><option>BAIXA</option></select></div><div id="osList" class="grid">${renderOrders(orders)}</div>`;
}
function renderOrders(list){
  const l=[...list].sort((a,b)=>peso(b.prioridade)-peso(a.prioridade));
  return l.length?l.map(o=>`<div class="card os ${o.prioridade==="CRITICA"?"critica":""}"><div class="grid g3"><div><h2>${esc(equipmentName(o.equipamento_id))}</h2><small>${esc(sectorName(o.setor_id))} • ${new Date(o.data_abertura).toLocaleString("pt-BR")} • Nº ${o.numero}</small><p>${esc(o.descricao)}</p><span class="pill ${priorityClass(o.prioridade)}">${o.prioridade}</span> <span class="pill">${o.status}</span></div><div class="photo-box">📷 Evidências salvas no Supabase</div><div><button class="btn light w-full detailOS" data-id="${o.id}">Ver detalhes</button>${o.status!=="CONCLUIDA"?`<button class="btn primary w-full mt startOS" data-id="${o.id}">Resolver agora</button><button class="btn light w-full mt finishOS" data-id="${o.id}">Concluir</button>`:""}</div></div></div>`).join(""):'<div class="empty">Nenhuma OS encontrada.</div>';
}
function equipPage(){
  return `<div class="hero"><div><h1>Equipamentos</h1><p>Cadastros centralizados no Supabase.</p></div><button class="btn orange" id="newEq">+ Novo equipamento</button></div><div class="grid g3">${equipment.length?equipment.map(e=>`<div class="card"><h2>${esc(e.nome)}</h2><p><b>Setor:</b> ${esc(sectorName(e.setor_id))}</p><p><b>Área:</b> ${esc(areaName(e.area_id))}</p><p><b>Status:</b> <span class="pill">${e.status}</span></p><p><b>Criticidade:</b> ${e.criticidade}</p><div class="photo-box"><b>TAG</b><br>${esc(e.tag||e.id.slice(0,8))}</div></div>`).join(""):'<div class="empty">Nenhum equipamento cadastrado.</div>'}</div>`;
}
function parseChecklist(p){
  if(Array.isArray(p.checklist_itens))return p.checklist_itens;
  try{const j=JSON.parse(p.observacoes||"{}");return j.itens||[]}catch{return String(p.observacoes||"").split("\n").filter(Boolean)}
}
function prevPage(){
  return `<div class="hero"><div><h1>Preventivas</h1><p>Checklist e fotos armazenados online.</p></div><button class="btn orange" id="newPrev">+ Nova preventiva</button></div><div class="grid g3">${preventives.length?preventives.map(p=>`<div class="card"><h2>${esc(equipmentName(p.equipamento_id))}</h2><p><b>Data:</b> ${new Date(p.data_programada+"T12:00:00").toLocaleDateString("pt-BR")}</p><p><b>Status:</b> <span class="pill">${p.status}</span></p><p><b>Itens obrigatórios:</b> ${parseChecklist(p).length}</p>${p.status!=="CONCLUIDA"?`<button class="btn primary w-full execPrev" data-id="${p.id}">Executar checklist</button>`:"<span class='badge'>Concluída</span>"}</div>`).join(""):'<div class="empty">Nenhuma preventiva cadastrada.</div>'}</div>`;
}
function usersPage(){
  return `<div class="hero"><div><h1>Usuários</h1><p>Perfis cadastrados no sistema.</p></div></div><div class="card"><table class="table"><tr><th>Nome</th><th>E-mail</th><th>Perfil</th><th>Status</th></tr>${profiles.map(p=>`<tr><td><b>${esc(p.nome)}</b></td><td>${esc(p.email||"")}</td><td><span class="pill">${p.role}</span></td><td>${p.ativo?"Ativo":"Inativo"}</td></tr>`).join("")}</table></div>`;
}
function reportsPage(){
  const open=orders.filter(o=>o.status!=="CONCLUIDA").length,done=orders.filter(o=>o.status==="CONCLUIDA").length,cost=orders.reduce((s,o)=>s+Number(o.custo_material||0)+Number(o.custo_terceiro||0)+Number(o.custo_interno||0),0);
  return `<div class="hero"><div><h1>Relatórios</h1><p>Resumo do piloto RioMar Recife.</p></div><button class="btn orange" onclick="window.print()">Gerar PDF</button></div><div class="grid g4">${kpi("OS abertas",open,"Pendentes")}${kpi("OS concluídas",done,"Finalizadas")}${kpi("Preventivas",preventives.length,"Programadas")}${kpi("Custo","R$ "+cost.toFixed(2).replace(".",","),"Registrado")}</div>`;
}
function bindPage(r){
  document.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>navigate(b.dataset.r));
  if(r==="dashboard")document.getElementById("refresh")?.addEventListener("click",async()=>{await loadBase();renderPage("dashboard");toast("Dados atualizados")});
  if(r==="abrir")bindOpenOS();
  if(r==="ordens")bindOrders();
  if(r==="equip")document.getElementById("newEq")?.addEventListener("click",newEquipmentModal);
  if(r==="prev"){document.getElementById("newPrev")?.addEventListener("click",newPreventiveModal);document.querySelectorAll(".execPrev").forEach(b=>b.onclick=()=>executePreventive(b.dataset.id))}
}
function bindOpenOS(){
  document.getElementById("osForm").onsubmit=async e=>{
    e.preventDefault();const f=Object.fromEntries(new FormData(e.target));const eq=equipment.find(x=>x.id===f.equipamento_id);
    const {error}=await sb.from("ordens_servico").insert({unidade_id:unitId,equipamento_id:f.equipamento_id||null,setor_id:eq?.setor_id||null,area_id:eq?.area_id||null,solicitante_id:currentUser.id,tipo:"CORRETIVA",status:"ABERTA",prioridade:f.prioridade,categoria:f.categoria,problema:f.problema,descricao:f.descricao});
    if(error){alert(error.message);return}await loadBase();toast("Chamado aberto e sincronizado");navigate("ordens");
  };
}
function bindOrders(){
  ["qOS","sOS","pOS"].forEach(id=>document.getElementById(id)?.addEventListener(id==="qOS"?"input":"change",()=>{document.getElementById("osList").innerHTML=renderOrders(ordersFiltered());bindOrderButtons()}));
  bindOrderButtons();
}
function bindOrderButtons(){
  document.querySelectorAll(".startOS").forEach(b=>b.onclick=async()=>{const {error}=await sb.from("ordens_servico").update({status:"EM_EXECUCAO",tecnico_id:currentUser.id,data_inicio:new Date().toISOString()}).eq("id",b.dataset.id);if(error)return alert(error.message);await loadBase();toast("OS em execução");renderPage("ordens")});
  document.querySelectorAll(".finishOS").forEach(b=>b.onclick=()=>finishOSModal(b.dataset.id));
  document.querySelectorAll(".detailOS").forEach(b=>b.onclick=()=>detailOS(b.dataset.id));
}
async function detailOS(id){
  const o=orders.find(x=>x.id===id);
  const {data:anexos}=await sb.from("os_anexos").select("*").eq("os_id",id).order("criado_em",{ascending:false});
  modal(`<h2>OS Nº ${o.numero}</h2><p><b>Equipamento:</b> ${esc(equipmentName(o.equipamento_id))}</p><p><b>Status:</b> ${o.status}</p><p><b>Descrição:</b> ${esc(o.descricao)}</p><p><b>Solução:</b> ${esc(o.solucao||"Ainda não concluída")}</p><p><b>Fotos:</b> ${(anexos||[]).length}</p>${(anexos||[]).map(a=>`<a href="${a.arquivo_url}" target="_blank">Abrir ${esc(a.arquivo_nome||"foto")}</a><br>`).join("")}`);
}
function modal(content){document.getElementById("modalRoot").innerHTML=`<div class="modal-bg"><div class="modal"><div class="modal-head"><span></span><button class="btn light" onclick="closeModal()">X</button></div>${content}</div></div>`}
function filePicker(prefix){
  return `<label class="label">Fotos obrigatórias</label><div class="photo-actions"><label class="btn primary photo-btn">📷 Tirar foto<input id="${prefix}Camera" type="file" accept="image/*" capture="environment"></label><label class="btn light photo-btn">🖼 Escolher da galeria<input id="${prefix}Gallery" type="file" accept="image/*" multiple></label></div><div id="${prefix}Count" class="muted mt">Nenhuma foto selecionada</div><div id="${prefix}Preview" class="preview"></div>`;
}
function bindFilePicker(prefix,target){
  const add=files=>{for(const f of files)target.push(f);document.getElementById(prefix+"Count").textContent=target.length+" foto(s) selecionada(s)";const p=document.getElementById(prefix+"Preview");p.innerHTML="";target.forEach(f=>{const img=document.createElement("img");img.src=URL.createObjectURL(f);p.appendChild(img)})};
  document.getElementById(prefix+"Camera").onchange=e=>add(e.target.files);
  document.getElementById(prefix+"Gallery").onchange=e=>add(e.target.files);
}
async function uploadFiles(files,folder){
  const urls=[];
  for(const f of files){
    const ext=(f.name.split(".").pop()||"jpg").toLowerCase(),path=`${unitId}/${folder}/${Date.now()}-${crypto.randomUUID()}.${ext}`;
    const {error}=await sb.storage.from("os-anexos").upload(path,f,{contentType:f.type,upsert:false});
    if(error)throw error;
    const {data}=sb.storage.from("os-anexos").getPublicUrl(path);urls.push({url:data.publicUrl,name:f.name,mime:f.type,size:f.size});
  }
  return urls;
}
function finishOSModal(id){
  const o=orders.find(x=>x.id===id);osFiles=[];
  modal(`<h2>Concluir OS</h2><p><b>${esc(equipmentName(o.equipamento_id))}</b></p><form id="finishOS">${filePicker("os")}<label class="label">Serviço executado</label><textarea id="osSolution" class="input" required></textarea><div class="formgrid"><div><label class="label">Peças/material</label><input id="osParts" class="input"></div><div><label class="label">Custo material (R$)</label><input id="osCost" class="input" type="number" min="0" step="0.01" value="0"></div></div><button class="btn primary w-full mt">Concluir e sincronizar</button></form>`);
  bindFilePicker("os",osFiles);
  document.getElementById("finishOS").onsubmit=async e=>{
    e.preventDefault();if(!osFiles.length)return alert("Adicione pelo menos uma foto usando Câmera ou Galeria.");
    try{
      const btn=e.target.querySelector("button");btn.disabled=true;btn.textContent="Enviando fotos...";
      const files=await uploadFiles(osFiles,`os-${id}`);
      for(const x of files)await sb.from("os_anexos").insert({os_id:id,unidade_id:unitId,usuario_id:currentUser.id,tipo:"foto",origem:"conclusao",arquivo_nome:x.name,arquivo_url:x.url,mime_type:x.mime,tamanho_bytes:x.size});
      const cost=Number(document.getElementById("osCost").value||0),solution=document.getElementById("osSolution").value,parts=document.getElementById("osParts").value;
      const {error}=await sb.from("ordens_servico").update({status:"CONCLUIDA",solucao:solution+(parts?` | Peças: ${parts}`:""),custo_material:cost,data_conclusao:new Date().toISOString(),tecnico_id:currentUser.id}).eq("id",id);
      if(error)throw error;
      if(cost>0)await sb.from("os_custos").insert({os_id:id,unidade_id:unitId,usuario_id:currentUser.id,tipo:"material",descricao:parts||"Material utilizado",valor:cost});
      await loadBase();closeModal();toast("OS concluída e sincronizada");renderPage("ordens");
    }catch(err){alert(err.message)}
  };
}
function newEquipmentModal(){
  modal(`<h2>Novo equipamento</h2><form id="eqForm"><div class="formgrid"><div><label class="label">Nome</label><input class="input" name="nome" required></div><div><label class="label">Setor</label><select class="input" name="setor_id"><option value="">Selecione</option>${sectors.map(s=>`<option value="${s.id}">${esc(s.nome)}</option>`).join("")}</select></div><div><label class="label">Área</label><select class="input" name="area_id"><option value="">Selecione</option>${areas.map(a=>`<option value="${a.id}">${esc(a.nome)}</option>`).join("")}</select></div><div><label class="label">Fabricante</label><input class="input" name="fabricante_texto"></div><div><label class="label">Status</label><select class="input" name="status"><option>OPERACIONAL</option><option>EM_MANUTENCAO</option><option>PARADO</option><option>AGUARDANDO_PECA</option></select></div><div><label class="label">Criticidade</label><select class="input" name="criticidade"><option>BAIXA</option><option>MEDIA</option><option>ALTA</option><option>CRITICA</option></select></div></div><button class="btn primary w-full mt">Salvar no Supabase</button></form>`);
  document.getElementById("eqForm").onsubmit=async e=>{
    e.preventDefault();const f=Object.fromEntries(new FormData(e.target));const {error}=await sb.from("equipamentos").insert({unidade_id:unitId,nome:f.nome,setor_id:f.setor_id||null,area_id:f.area_id||null,fabricante_texto:f.fabricante_texto,status:f.status,criticidade:f.criticidade,tag:`RMR-${Date.now().toString().slice(-6)}`,criado_por:currentUser.id});
    if(error)return alert(error.message);await loadBase();closeModal();toast("Equipamento sincronizado");renderPage("equip");
  };
}
function newPreventiveModal(){
  const fryer=["VERIFICAR VAZAMENTO DE GÁS NAS CONEXÕES DA MANGUEIRA DO EQUIPAMENTO","VERIFICAR VAZAMENTO NA MANGUEIRA DE GÁS","VERIFICAR VAZAMENTO NA VÁLVULA TIPO BORBOLETA","REALIZAR A LIMPEZA E VERIFICAR A QUALIDADE DOS QUEIMADORES","LIMPEZA DA SUPERFÍCIE E DENTRO DA CHAMINÉ","TESTAR O FUNCIONAMENTO DO EQUIPAMENTO"];
  modal(`<h2>Nova preventiva</h2><form id="prevForm"><label class="label">Equipamento</label><select class="input" name="equipamento_id" required>${equipment.map(e=>`<option value="${e.id}">${esc(e.nome)}</option>`).join("")}</select><label class="label">Data programada</label><input class="input" name="data" type="date" required><label class="label">Resumo</label><input class="input" name="resumo" placeholder="Ex: Preventiva mensal"><label class="label">Itens obrigatórios (um por linha)</label><textarea class="input" id="prevItems" name="itens" required></textarea><button type="button" id="fryerModel" class="btn light w-full mt">Usar modelo de fritadeira</button><button class="btn primary w-full mt">Salvar no Supabase</button></form>`);
  document.getElementById("fryerModel").onclick=()=>document.getElementById("prevItems").value=fryer.join("\n");
  document.getElementById("prevForm").onsubmit=async e=>{
    e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),items=f.itens.split("\n").map(x=>x.trim()).filter(Boolean);
    const {error}=await sb.from("preventivas_agendamentos").insert({unidade_id:unitId,equipamento_id:f.equipamento_id,data_programada:f.data,status:"AGENDADA",observacoes:JSON.stringify({resumo:f.resumo,itens:items}),checklist_itens:items});
    if(error)return alert(error.message);await loadBase();closeModal();toast("Preventiva sincronizada");renderPage("prev");
  };
}
function executePreventive(id){
  const p=preventives.find(x=>x.id===id),items=parseChecklist(p);prevFiles=[];
  modal(`<h2>Executar preventiva</h2><p><b>${esc(equipmentName(p.equipamento_id))}</b></p><form id="execPrev">${items.map((it,i)=>`<div class="check" data-item="${esc(it)}"><b>${i+1}. ${esc(it)}</b><p><button type="button" class="choice okc" data-v="CONFORME">Conforme</button> <button type="button" class="choice noc" data-v="NAO_CONFORME">Não conforme</button></p><textarea class="input hidden obs" placeholder="Observação obrigatória"></textarea></div>`).join("")}${filePicker("prev")}<button class="btn primary w-full mt">Concluir preventiva</button></form>`);
  bindFilePicker("prev",prevFiles);
  document.querySelectorAll(".choice").forEach(c=>c.onclick=()=>{const w=c.closest(".check");w.querySelectorAll(".choice").forEach(x=>x.classList.remove("active"));c.classList.add("active");w.querySelector(".obs").classList.toggle("hidden",c.dataset.v!=="NAO_CONFORME")});
  document.getElementById("execPrev").onsubmit=async e=>{
    e.preventDefault();const responses=[];let invalid=false;const non=[];
    document.querySelectorAll(".check").forEach(w=>{const a=w.querySelector(".choice.active"),obs=w.querySelector(".obs").value.trim(),item=w.dataset.item;if(!a||(a.dataset.v==="NAO_CONFORME"&&!obs))invalid=true;responses.push({item,status:a?.dataset.v||"",observacao:obs});if(a?.dataset.v==="NAO_CONFORME")non.push({item,obs})});
    if(invalid)return alert("Marque todos os itens. Não conforme exige observação.");if(!prevFiles.length)return alert("Adicione pelo menos uma foto usando Câmera ou Galeria.");
    try{
      const btn=e.target.querySelector("button[type=submit]");btn.disabled=true;btn.textContent="Enviando fotos...";
      const files=await uploadFiles(prevFiles,`preventiva-${id}`);
      for(const x of files)await sb.from("preventivas_anexos").insert({agendamento_id:id,unidade_id:unitId,usuario_id:currentUser.id,arquivo_nome:x.name,arquivo_url:x.url,mime_type:x.mime,tamanho_bytes:x.size});
      for(const r of responses)await sb.from("preventivas_checklist_respostas").insert({agendamento_id:id,item:r.item,conforme:r.status==="CONFORME",observacao:r.observacao});
      const {error}=await sb.from("preventivas_agendamentos").update({status:"CONCLUIDA",executado_por:currentUser.id,executado_em:new Date().toISOString(),fotos_urls:files.map(x=>x.url)}).eq("id",id);
      if(error)throw error;
      for(const n of non)await sb.from("ordens_servico").insert({unidade_id:unitId,equipamento_id:p.equipamento_id,solicitante_id:currentUser.id,tipo:"PREVENTIVA",status:"ABERTA",prioridade:"ALTA",categoria:"Preventiva",problema:"Não conformidade",descricao:`Não conformidade: ${n.item}. Observação: ${n.obs}`});
      await loadBase();closeModal();toast("Preventiva concluída e sincronizada");renderPage("prev");
    }catch(err){alert(err.message)}
  };
}
bootstrap().catch(e=>{console.error(e);document.getElementById("app").innerHTML=`<div class="login"><div class="login-box">${logo()}<h1>Erro ao abrir</h1><p>${esc(e.message)}</p><button class="btn primary" onclick="location.reload()">Atualizar</button></div></div>`});
</script>
</body>
</html>
