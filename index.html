<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Manutenção Entre Amigos - Piloto RioMar</title>
<style>
:root{--n:#001f3f;--o:#ff7a00;--b:#f4f7fb;--t:#071d49;--g:#22c55e;--r:#ef4444;--y:#f59e0b}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--b);color:var(--t)}button,input,select,textarea{font:inherit}button{cursor:pointer}.btn{border:0;border-radius:14px;padding:13px 16px;font-weight:800}.primary{background:var(--n);color:white}.orange{background:var(--o);color:white}.light{background:white;color:var(--n);border:1px solid #cbd5e1}.input{width:100%;border:1px solid #cbd5e1;border-radius:14px;padding:12px;margin-top:6px}.label{display:block;font-size:12px;font-weight:800;margin-top:14px;color:#64748b;text-transform:uppercase}.login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--n),#063763);padding:18px}.login .box{background:white;border-radius:28px;padding:28px;width:min(460px,100%);box-shadow:0 20px 60px #0005}.logo{background:white;border-radius:18px;text-align:center;padding:14px;margin-bottom:16px}.logo b{font-size:26px;color:var(--n);display:block}.bar{height:7px;background:var(--o);border-radius:99px;width:120px;margin:8px auto 0}.shell{display:grid;grid-template-columns:280px 1fr;min-height:100vh}.side{background:var(--n);color:white;padding:20px;position:sticky;top:0;height:100vh}.side button{display:block;width:100%;text-align:left;background:transparent;color:white;border:0;padding:14px;border-radius:14px;font-weight:800;margin:5px 0}.side button:hover{background:var(--o)}.top{height:78px;background:white;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between;padding:0 24px}.content{padding:24px}.hero{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;margin-bottom:18px}.actions{display:flex;gap:8px;flex-wrap:wrap}.grid{display:grid;gap:16px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.card{background:white;border:1px solid #e1e8f2;border-radius:22px;padding:20px;box-shadow:0 8px 24px #0f172a12}.kpi{font-size:34px;font-weight:900}.muted{color:#64748b}.pill{display:inline-block;border-radius:999px;padding:5px 10px;font-size:11px;font-weight:800;background:#eff6ff;color:#1d4ed8}.crit{background:#fee2e2;color:#991b1b}.alta{background:#ffedd5;color:#9a3412}.ok{background:#dcfce7;color:#166534}.os{border-left:7px solid #2563eb}.os.critica{border-left-color:var(--r)}.dot{width:12px;height:12px;border-radius:50%;display:inline-block;margin-right:8px}.green{background:var(--g)}.yellow{background:var(--y)}.red{background:var(--r)}.modal-bg{position:fixed;inset:0;background:#001f3f99;display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}.modal{background:white;border-radius:24px;padding:22px;width:min(780px,100%);max-height:92vh;overflow:auto}.modal-head{display:flex;justify-content:space-between}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.check{border:1px solid #dbe4f0;border-radius:16px;padding:12px;margin:10px 0}.choice{border:1px solid #cbd5e1;background:white;border-radius:99px;padding:8px 12px;font-weight:800}.choice.active.okc{background:#dcfce7;color:#166534}.choice.active.noc{background:#fee2e2;color:#991b1b}.hidden{display:none}.bottom{display:none}.toast{position:fixed;right:16px;bottom:16px;background:var(--n);color:white;padding:12px 16px;border-radius:14px;font-weight:800;z-index:50}
@media(max-width:900px){.shell{display:block}.side{display:none}.top{height:auto;padding:12px}.content{padding:16px 16px 82px}.hero{display:block}.actions button{width:100%;margin-top:8px}.g4,.g3,.formgrid{grid-template-columns:1fr}.bottom{display:flex;position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #ddd;z-index:10}.bottom button{flex:1;border:0;background:white;color:var(--n);padding:10px 4px;font-weight:800;font-size:11px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const KEY="ea_v15_piloto_riomar";
let user=null;
const seed={equipamentos:[
{id:"eq1",nome:"Câmara Fria Sushi",setor:"Sushi",area:"Sushi Bar",status:"OPERACIONAL",criticidade:"CRITICA",tag:"RMR-SUS-001"},
{id:"eq2",nome:"Máquina de Gelo",setor:"Bar",area:"Bar Principal",status:"EM_MANUTENCAO",criticidade:"ALTA",tag:"RMR-BAR-002"},
{id:"eq3",nome:"Ar Condicionado Salão",setor:"Salão",area:"Salão Principal",status:"OPERACIONAL",criticidade:"ALTA",tag:"RMR-SAL-003"},
{id:"eq4",nome:"Fritadeira",setor:"Cozinha",area:"Cozinha Quente",status:"OPERACIONAL",criticidade:"ALTA",tag:"RMR-COZ-004"}],
ordens:[
{id:"os1",numero:"0001",equipamento:"Máquina de Gelo",setor:"Bar",descricao:"Baixa produção de gelo durante o pico da operação.",prioridade:"ALTA",status:"ABERTA",data:"Hoje"},
{id:"os2",numero:"0002",equipamento:"Câmara Fria Sushi",setor:"Sushi",descricao:"Oscilação de temperatura registrada pela equipe.",prioridade:"CRITICA",status:"EM_EXECUCAO",data:"Hoje"}],
preventivas:[{id:"p1",equipamento:"Fritadeira",setor:"Cozinha",data:"Rotina mensal",status:"AGENDADA",checklist:"Preventiva obrigatória da fritadeira.",itens:["VERIFICAR VAZAMENTO DE GÁS NAS CONEXÕES DA MANGUEIRA DO EQUIPAMENTO","VERIFICAR VAZAMENTO NA MANGUEIRA DE GÁS","VERIFICAR VAZAMENTO NA VÁLVULA TIPO BORBOLETA","REALIZAR A LIMPEZA E VERIFICAR A QUALIDADE DOS QUEIMADORES","LIMPEZA DA SUPERFÍCIE E DENTRO DA CHAMINÉ","TESTAR O FUNCIONAMENTO DO EQUIPAMENTO"]}],
usuarios:[{nome:"Deivde Davson",email:"deivde@restauranteentreamigos.com.br",role:"MASTER",status:"Ativo"},{nome:"Técnico Manutenção",email:"tecnico.riomar@entreamigos.local",role:"TECNICO",status:"Modelo"}]};
function db(){let r=localStorage.getItem(KEY);if(!r){localStorage.setItem(KEY,JSON.stringify(seed));return structuredClone(seed)}return JSON.parse(r)}
function save(d){localStorage.setItem(KEY,JSON.stringify(d))}
function logo(){return '<div class="logo"><b>ENTRE<br>AMIGOS</b><div class="bar"></div></div>'}
function toast(m){let t=document.createElement("div");t.className="toast";t.innerText=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
function nav(r){if(!user&&r!="login")r="login";render(r)}
function render(r){let app=document.getElementById("app");try{if(r=="login"){app.innerHTML=login();bindLogin();return}app.innerHTML=layout(page(r));bindLayout();bindPage(r)}catch(e){app.innerHTML='<div class="login"><div class="box"><h1>Erro</h1><p>'+e.message+'</p><button onclick="location.reload()" class="btn primary">Atualizar</button></div></div>';console.error(e)}}
function layout(c){let menu=[["⌂","Dashboard","dashboard"],["➕","Abrir Chamado","abrir"],["📋","Ocorrências","ordens"],["🏭","Equipamentos","equip"],["📅","Preventivas","prev"],["👥","Usuários","users"],["📊","Relatórios","rel"]];return '<div class="shell"><aside class="side">'+logo()+'<small>Manutenção V15 • RioMar</small><p>'+user.nome+'<br><b>'+user.role+'</b></p>'+menu.map(m=>'<button data-r="'+m[2]+'">'+m[0]+" "+m[1]+'</button>').join("")+'</aside><main><div class="top"><div><b>Plataforma de Manutenção Entre Amigos</b><br><small>Unidade piloto: RioMar Recife</small></div><button id="sair" class="btn light">Sair</button></div><section class="content">'+c+'</section></main><div class="bottom">'+menu.slice(0,4).map(m=>'<button data-r="'+m[2]+'"><div>'+m[0]+'</div>'+m[1]+'</button>').join("")+'</div></div>'}
function bindLayout(){document.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>nav(b.dataset.r));document.getElementById("sair").onclick=()=>{user=null;nav("login")}}
function login(){return '<div class="login"><div class="box">'+logo()+'<span class="pill ok">V15 Piloto • RioMar Recife</span><h1>Login</h1><p>Use o modo piloto para iniciar o teste hoje.</p><input class="input" value="deivde@restauranteentreamigos.com.br"><input class="input" type="password" placeholder="Senha"><button id="entrar" class="btn primary w-full mt">Entrar em modo piloto</button></div></div>'}
function bindLogin(){document.getElementById("entrar").onclick=()=>{user={nome:"Deivde Davson",role:"MASTER"};nav("dashboard")}}
function page(r){return r=="dashboard"?dash():r=="abrir"?abrir():r=="ordens"?ordens():r=="equip"?equip():r=="prev"?prev():r=="users"?users():r=="rel"?rel():dash()}
function bindPage(r){if(r=="abrir")bindAbrir();if(r=="ordens")bindOrdens();if(r=="equip")bindEquip();if(r=="prev")bindPrev();if(r=="users")bindUsers()}
function peso(p){return {BAIXA:1,MEDIA:2,ALTA:3,CRITICA:4}[p]||0}
function kpi(t,v,s){return '<div class="card"><div class="muted">'+t+'</div><div class="kpi">'+v+'</div><small>'+s+'</small></div>'}
function dash(){let d=db(),os=d.ordens.filter(o=>o.status!="CONCLUIDA"),pri=os.sort((a,b)=>peso(b.prioridade)-peso(a.prioridade)).slice(0,3);return '<div class="hero"><div><h1>Dashboard RioMar Recife</h1><p>Painel para iniciar os testes hoje.</p></div><div class="actions"><button class="btn orange" data-r="abrir">+ Abrir chamado</button><button class="btn light" data-r="equip">+ Equipamento</button><button class="btn light" data-r="prev">+ Preventiva</button></div></div><div class="grid g4">'+kpi("OS abertas",os.length,"Chamados em andamento")+kpi("Críticas",os.filter(o=>o.prioridade=="CRITICA").length,"Ação imediata")+kpi("Equip. atenção",d.equipamentos.filter(e=>e.status!="OPERACIONAL").length,"Parado/manutenção")+kpi("Preventivas",d.preventivas.filter(p=>p.status=="AGENDADA").length,"Programadas")+'</div><div class="grid g3 mt"><div class="card"><h2>Painel Operacional</h2>'+op("Salão","green","Operando")+op("Bar","yellow","Chamado aberto")+op("Cozinha","green","Operando")+op("Sushi","red","Atenção crítica")+'</div><div class="card"><h2>Ocorrências Prioritárias</h2>'+pri.map(o=>'<div class="card os '+(o.prioridade=="CRITICA"?"critica":"")+'" style="box-shadow:none;margin-bottom:10px"><b>'+o.equipamento+'</b><p>'+o.descricao+'</p><span class="pill '+(o.prioridade=="CRITICA"?"crit":"alta")+'">'+o.prioridade+'</span> <span class="pill">'+o.status+'</span></div>').join("")+'</div><div class="card"><h2>Teste de hoje</h2><p>1. Abrir 3 OS reais<br>2. Cadastrar equipamentos críticos<br>3. Executar preventiva da fritadeira<br>4. Testar em 2 celulares</p></div></div>'}
function op(n,c,s){return '<p><span class="dot '+c+'"></span><b>'+n+'</b><span style="float:right">'+s+'</span></p>'}
function abrir(){let e=db().equipamentos;return '<div class="hero"><div><h1>Abrir Chamado</h1><p>Registro rápido com prioridade.</p></div></div><div class="card"><form id="formOS"><div class="formgrid"><div><label class="label">Equipamento</label><select class="input" name="eq">'+e.map(x=>'<option value="'+x.id+'">'+x.nome+" • "+x.setor+'</option>').join("")+'</select></div><div><label class="label">Prioridade</label><select class="input" name="pri"><option>BAIXA</option><option selected>MEDIA</option><option>ALTA</option><option>CRITICA</option></select></div></div><label class="label">Descrição</label><textarea class="input" name="desc" required></textarea><label class="label">Foto</label><input class="input" type="file" accept="image/*,video/*" capture="environment"><button class="btn primary w-full mt">Enviar chamado</button></form></div>'}
function bindAbrir(){document.getElementById("formOS").onsubmit=e=>{e.preventDefault();let d=db(),f=new FormData(e.target),eq=d.equipamentos.find(x=>x.id==f.get("eq"));d.ordens.unshift({id:"os_"+Date.now(),numero:String(d.ordens.length+1).padStart(4,"0"),equipamento:eq.nome,setor:eq.setor,descricao:f.get("desc"),prioridade:f.get("pri"),status:"ABERTA",data:"Agora"});save(d);toast("Chamado aberto");nav("ordens")}}
function ordens(){let o=db().ordens.filter(x=>x.status!="CONCLUIDA").sort((a,b)=>peso(b.prioridade)-peso(a.prioridade));return '<div class="hero"><div><h1>Ocorrências / OS</h1><p>Fila priorizada.</p></div><button class="btn orange" data-r="abrir">+ Nova OS</button></div><div class="grid">'+o.map(x=>'<div class="card os '+(x.prioridade=="CRITICA"?"critica":"")+'"><div class="grid g3"><div><h2>'+x.equipamento+'</h2><small>'+x.setor+' • '+x.data+' • Nº '+x.numero+'</small><p>'+x.descricao+'</p><span class="pill '+(x.prioridade=="CRITICA"?"crit":"alta")+'">'+x.prioridade+'</span> <span class="pill">'+x.status+'</span></div><div class="photo-box">📷 Foto</div><div><button class="btn primary w-full resolver" data-id="'+x.id+'">Resolver agora</button><button class="btn light w-full mt concluir" data-id="'+x.id+'">Concluir</button></div></div></div>').join("")+'</div>'}
function bindOrdens(){document.querySelectorAll(".resolver").forEach(b=>b.onclick=()=>{let d=db(),o=d.ordens.find(x=>x.id==b.dataset.id);o.status="EM_EXECUCAO";save(d);toast("OS em execução");nav("ordens")});document.querySelectorAll(".concluir").forEach(b=>b.onclick=()=>{let d=db(),o=d.ordens.find(x=>x.id==b.dataset.id);o.status="CONCLUIDA";save(d);toast("OS concluída");nav("ordens")})}
function equip(){let e=db().equipamentos;return '<div class="hero"><div><h1>Equipamentos</h1></div><button class="btn orange" id="novoEquip">+ Novo equipamento</button></div><div class="grid g3">'+e.map(x=>'<div class="card"><h2>'+x.nome+'</h2><p><b>Setor:</b> '+x.setor+'</p><p><b>Área:</b> '+x.area+'</p><p><b>Status:</b> <span class="pill">'+x.status+'</span></p><div class="photo-box"><b>QR</b><br>'+x.tag+'</div></div>').join("")+'</div><div id="modal"></div>'}
function bindEquip(){document.getElementById("novoEquip").onclick=()=>{modal('<h2>Novo equipamento</h2><form id="feq"><input class="input" name="nome" placeholder="Nome" required><input class="input" name="setor" placeholder="Setor" required><input class="input" name="area" placeholder="Área"><select class="input" name="status"><option>OPERACIONAL</option><option>EM_MANUTENCAO</option><option>PARADO</option></select><button class="btn primary w-full mt">Salvar</button></form>');document.getElementById("feq").onsubmit=e=>{e.preventDefault();let d=db(),f=Object.fromEntries(new FormData(e.target));d.equipamentos.unshift({id:"eq_"+Date.now(),nome:f.nome,setor:f.setor,area:f.area,status:f.status,criticidade:"MEDIA",tag:"RMR-"+Date.now().toString().slice(-5)});save(d);closeModal();nav("equip")}}}
function prev(){let p=db().preventivas;return '<div class="hero"><div><h1>Preventivas</h1></div><button class="btn orange" id="novaPrev">+ Nova preventiva</button></div><div class="grid g3">'+p.map(x=>'<div class="card"><h2>'+x.equipamento+'</h2><p>'+x.checklist+'</p><p><b>Itens:</b> '+x.itens.length+'</p><span class="pill">'+x.status+'</span><button class="btn primary w-full mt exec" data-id="'+x.id+'">Executar checklist</button></div>').join("")+'</div><div id="modal"></div>'}
function bindPrev(){document.getElementById("novaPrev").onclick=()=>{let d=db(),e=d.equipamentos,modelo=seed.preventivas[0].itens.join("\n");modal('<h2>Nova preventiva</h2><form id="fp"><select class="input" name="eq">'+e.map(x=>'<option value="'+x.id+'">'+x.nome+'</option>').join("")+'</select><input class="input" name="resumo" placeholder="Resumo"><textarea class="input" id="itens" name="itens"></textarea><button type="button" class="btn light w-full mt" id="modelo">Usar modelo fritadeira</button><button class="btn primary w-full mt">Salvar</button></form>');document.getElementById("modelo").onclick=()=>document.getElementById("itens").value=modelo;document.getElementById("fp").onsubmit=e=>{e.preventDefault();let f=Object.fromEntries(new FormData(e.target)),eq=d.equipamentos.find(x=>x.id==f.eq);d.preventivas.unshift({id:"p_"+Date.now(),equipamento:eq.nome,setor:eq.setor,data:"Agendada",status:"AGENDADA",checklist:f.resumo,itens:f.itens.split("\n").filter(Boolean)});save(d);closeModal();nav("prev")}};document.querySelectorAll(".exec").forEach(b=>b.onclick=()=>execPrev(b.dataset.id))}
function execPrev(id){let d=db(),p=d.preventivas.find(x=>x.id==id);modal('<h2>Executar checklist</h2><p><b>'+p.equipamento+'</b></p><form id="exec">'+p.itens.map((it,i)=>'<div class="check"><b>'+(i+1)+'. '+it+'</b><p><button type="button" class="choice okc" data-v="OK">Conforme</button> <button type="button" class="choice noc" data-v="NO">Não conforme</button></p><textarea class="input hidden obs" placeholder="Observação obrigatória"></textarea></div>').join("")+'<button class="btn primary w-full mt">Concluir preventiva</button></form>');document.querySelectorAll(".choice").forEach(c=>c.onclick=()=>{let w=c.closest(".check");w.querySelectorAll(".choice").forEach(x=>x.classList.remove("active"));c.classList.add("active");let obs=w.querySelector(".obs");c.dataset.v=="NO"?obs.classList.remove("hidden"):obs.classList.add("hidden")});document.getElementById("exec").onsubmit=e=>{e.preventDefault();let inc=false,gerar=[];document.querySelectorAll(".check").forEach((w,i)=>{let a=w.querySelector(".choice.active"),obs=w.querySelector(".obs").value;if(!a)inc=true;if(a.dataset.v=="NO"&&!obs)inc=true;if(a?.dataset.v=="NO")gerar.push({item:p.itens[i],obs})});if(inc)return alert("Marque todos os itens. Não conforme exige observação.");p.status="CONCLUIDA";gerar.forEach(g=>d.ordens.unshift({id:"os_"+Date.now()+Math.random(),numero:String(d.ordens.length+1).padStart(4,"0"),equipamento:p.equipamento,setor:p.setor,descricao:"Não conformidade preventiva: "+g.item+". Obs: "+g.obs,prioridade:"ALTA",status:"ABERTA",data:"Agora"}));save(d);closeModal();toast("Preventiva concluída");nav("prev")}}
function users(){let u=db().usuarios;return '<div class="hero"><div><h1>Usuários</h1></div><button id="nu" class="btn orange">+ Novo usuário</button></div><div class="card"><table class="table"><tr><th>Nome</th><th>E-mail</th><th>Perfil</th><th>Status</th></tr>'+u.map(x=>'<tr><td><b>'+x.nome+'</b></td><td>'+x.email+'</td><td><span class="pill">'+x.role+'</span></td><td>'+x.status+'</td></tr>').join("")+'</table></div><div id="modal"></div>'}
function bindUsers(){document.getElementById("nu").onclick=()=>{modal('<h2>Novo usuário</h2><form id="fu"><input class="input" name="nome" placeholder="Nome"><input class="input" name="email" placeholder="E-mail"><select class="input" name="role"><option>OPERADOR</option><option>TECNICO</option><option>GERENTE</option><option>ADMIN</option></select><button class="btn primary w-full mt">Salvar</button></form>');document.getElementById("fu").onsubmit=e=>{e.preventDefault();let d=db();d.usuarios.unshift({...Object.fromEntries(new FormData(e.target)),status:"Pendente Supabase"});save(d);closeModal();nav("users")}}}
function rel(){let d=db();return '<div class="hero"><div><h1>Relatórios</h1><p>Resumo do piloto.</p></div><button onclick="window.print()" class="btn orange">Gerar PDF</button></div><div class="grid g3">'+kpi("OS abertas",d.ordens.filter(o=>o.status!="CONCLUIDA").length,"Pendentes")+kpi("Preventivas",d.preventivas.length,"Cadastradas")+kpi("Equipamentos",d.equipamentos.length,"Ativos")+'</div>'}
function modal(c){document.getElementById("modal").innerHTML='<div class="modal-bg"><div class="modal"><div class="modal-head"><span></span><button class="btn light" onclick="closeModal()">X</button></div>'+c+'</div></div>'}
function closeModal(){let m=document.getElementById("modal");if(m)m.innerHTML=""}
nav("login");
</script>
</body>
</html>
