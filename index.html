function kpi(icon,title,value,sub,color){return `<div class="card p-5 flex items-center gap-4"><div class="kicon" style="background:${color}">${icon}</div><div><div class="text-xs font-black">${title}</div><div class="text-3xl font-black">${value}</div><div class="text-xs text-slate-500">${sub}</div></div></div>`}function statusLine(i,l,c,cls){return `<div class="flex justify-between py-3 text-sm"><div class="flex gap-3"><span class="${cls} text-xl">${i}</span><b>${l}</b></div><span>${c}</span></div>`}
function dashboard(){let d=load(),os=rowsStore(d.ordens),eqs=rowsStore(d.equipamentos),prev=rowsStore(d.preventivas),ab=os.filter(o=>o.status=='ABERTA').length,and=os.filter(o=>o.status=='EM_EXECUCAO').length,con=os.filter(o=>o.status=='CONCLUIDA').length,custo=os.reduce((s,o)=>s+custoTotal(o),0);setTimeout(()=>{let c=document.getElementById('donut');if(c)new Chart(c,{type:'doughnut',data:{labels:['Abertas','Em Andamento','Concluídas','Atrasadas'],datasets:[{data:[ab,and,con,os.filter(o=>o.prioridade=='CRITICA').length],backgroundColor:['#0757d8','#ff7a00','#23a047','#e63125']}]},options:{plugins:{legend:{position:'right'}},cutout:'58%'}})},0);return `<div class="mb-5"><h2 class="text-2xl font-black">Bem-vindo, Administrador!</h2><div class='text-xs font-black text-green-700 mt-1'>Versão 5.4 final</div><p class="text-slate-500">Visão geral da manutenção da loja ${nomeLoja(store())}</p></div><div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-5 gap-4 mb-5">${kpi('▣','Ordens Abertas',ab,'Em andamento','#0757d8')}${kpi('▣','Preventivas Agendadas',prev.length,'Próximos 7 dias','#ff7a00')}${kpi('✓','Ordens Concluídas',con,'Este mês','#23a047')}${kpi('!','Atrasadas',os.filter(o=>o.prioridade=='CRITICA'&&o.status!='CONCLUIDA').length,'Requer atenção','#e63125')}${kpi('$','Custo do Mês',money(custo),'Total acumulado','#6d35d5')}</div><div class="grid grid-cols-1 xl:grid-cols-12 gap-5"><div class="xl:col-span-3 space-y-5"><div class="card p-5"><h3 class="font-black mb-4">Ordens de Serviço por Status</h3><canvas id="donut"></canvas><button onclick="show('os')" class="btn btn-o w-full mt-4">Ver todas as ordens</button></div><div class="card p-5"><h3 class="font-black mb-4">Equipamentos por Status</h3>${statusLine('✓','Operacionais',eqs.filter(e=>e.status=='OPERACIONAL').length,'text-green-600')}${statusLine('⚒','Em Manutenção',eqs.filter(e=>e.status=='EM_MANUTENCAO').length,'text-orange-600')}${statusLine('×','Parados',eqs.filter(e=>e.status=='PARADO').length,'text-red-60 function calendar(){

 const nav=`<div class="flex justify-between mb-3"><div class="flex gap-1"><button onclick="moveCalendar(-1)" class="btn btn-o text-xs">‹</button><button onclick="moveCalendar(1)" class="btn btn-o text-xs">›</button><button onclick="todayCalendar()" class="btn btn-o text-xs">Hoje</button></div><h3 class="font-black text-lg capitalize">${title}</h3><div class="flex gap-1"><button onclick="setCalendarView('month')" class="btn ${window.calendarView==='month'?'btn-primary':'btn-o'} text-xs">Mês</button><button onclick="setCalendarView('week')" class="btn ${window.calendarView==='week'?'btn-primary':'btn-o'} text-xs">Semana</button><button onclick="setCalendarView('agenda')" class="btn ${window.calendarView==='agenda'?'btn-primary':'btn-o'} text-xs">Agenda</button></div></div>`;
 if(window.calendarView==='agenda') return nav+agendaCalendar(p);
 if(window.calendarView==='week') return nav+weekCalendar(p);
 return nav+monthCalendar(p,y,m)
}
function setCalendarView(v){window.calendarView=v;show(location.hash.replace('#','')||'dashboard')}
function moveCalendar(delta){
 if(window.calendarView==='week') window.calendarDate.setDate(window.calendarDate.getDate()+(delta*7));
 else window.calendarDate=new Date(window.calendarDate.getFullYear(),window.calendarDate.getMonth()+delta,1);
 show(location.hash.replace('#','')||'dashboard')
}
function todayCalendar(){window.calendarDate=new Date();show(location.hash.replace('#','')||'dashboard')}
function dateKey(dt){return dt.toISOString().slice(0,10)}
function monthCalendar(prevs,y,m){
 const first=new Date(y,m,1), start=first.getDay(), last=new Date(y,m+1,0).getDate();
 let cells='';
 for(let i=0;i<start;i++)cells+=`<div class="day text-slate-300"></div>`;
 for(let d=1;d<=last;d++){
  const key=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  const list=prevs.filter(p=>p.data===key);
  cells+=`<div class="day"><b>${d}</b>${list.map((ev,i)=>eventChip(ev,i)).join('')}</div>`;
 }
 return `<div class="cal border-t border-l border-slate-200"><div class="head">Dom</div><div class="head">Seg</div><div class="head">Ter</div><div class="head">Qua</div><div class="head">Qui</div><div class="head">Sex</div><div class="head">Sáb</div>${cells}</div>`
}
function weekCalendar(prevs){
 let base=new Date(window.calendarDate), day=base.getDay();base.setDate(base.getDate()-day);
 let cells='';
 for(let i=0;i<7;i++){
  let dt=new Date(base);dt.setDate(base.getDate()+i);let key=dateKey(dt),list=prevs.filter(p=>p.data===key);
  cells+=`<div class="day"><b>${dt.toLocaleDateString('pt-BR',{weekday:'short'})}<br>${dt.getDate()}</b>${list.map((ev,j)=>eventChip(ev,j)).join('')}</div>`;
 }
 return `<div class="cal border-t border-l border-slate-200">${cells}</div>`
}
function agendaCalendar(prevs){
 if(!prevs.length)return `<div class="card p-5 shadow-none text-slate-500">Nenhuma preventiva agendada.</div>`;
 return `<div class="space-y-2">${prevs.map(p=>`<div onclick="openPrevDetails('${p.id}')" class="border rounded-xl p-3 cursor-pointer hover:bg-slate-50"><div class="flex justify-between"><b>${eqNome(p.equipamento_id)}</b><span class="pill ${prevClass(prevStatus(p))}">${prevLabel(prevStatus(p))}</span></div><p class="text-xs text-slate-500">${fmtDate(p.data)} ${p.hora||''} • ${p.atividade}</p></div>`).join('')}</div>`
}
function eventChip(ev,i){
 let cl=i%4==0?'eb':i%4==1?'ep':i%4==2?'eg':'eo';
 return `<div onclick="openPrevDetails('${ev.id}')" class="event ${cl} cursor-pointer">${eqNome(ev.equipamento_id)}<br>${ev.hora||''}</div>`
}
function openPrevDetails(id){
 let d=load(),p=d.preventivas.find(x=>x.id==id);if(!p)return;let e=eq(p.equipamento_id)||{};
 modal('Detalhes da Preventiva',`<div class="space-y-4"><div><h2 class="text-2xl font-black text-primary">${e.nome||'Equipamento'}</h2><p class="text-slate-500">${nomeLoja(p.loja_id)} • ${nomeSetor(e.setor_id)} • ${nomeArea(e.area_id)}</p></div><div class="grid grid-cols-1 md:grid-cols-3 gap-3">${miniKpi('Data',fmtDate(p.data))}${miniKpi('Hora',p.hora||'-')}${miniKpi('Status',prevLabel(prevStatus(p)))}</div><div class="card p-4 shadow-none"><h3 class="font-black mb-2">Informações</h3><p><b>Atividade:</b> ${p.atividade||'-'}</p><p><b>Recorrência:</b> ${p.recorrencia_dias||30} dias</p><p><b>Execução:</b> ${p.tipo_execucao||'INTERNA'}</p><p><b>Empresa responsável:</b> ${p.empresa_responsavel||'Equipe interna'}</p><p><b>Custo extra:</b> ${money(p.custo_extra||0)}</p></div><div class="card p-4 shadow-none"><h3 class="font-black mb-2">Checklist</h3><p class="text-sm text-slate-600">${p.checklist||e.checklist_padrao||'Sem checklist cadastrado.'}</p></div><div class="flex gap-2 justify-end"><button onclick="executarPrev('${p.id}');closeModal()" class="btn btn-outline-green">Executar Preventiva</button><button onclick="concluirPrev('${p.id}');closeModal()" class="btn btn-primary">Concluir e Reprogramar</button></div></div>`)
}
function prevTable(list){return `<table class="w-full text-xs"><thead><tr class="text-left"><th>Equipamento</th><th>Atividade</th><th>Setor</th><th>Data</th><th>Hora</th><th>Status</th></tr></thead><tbody>${list.map(p=>{let e=eq(p.equipamento_id)||{};return `<tr class="border-t cursor-pointer hover:bg-slate-50" onclick="openPrevDetails('${p.id}')"><td class="py-3 font-black">${e.nome||''}</td><td>${p.atividade}</td><td>${nomeSetor(e.setor_id)}</td><td>${fmt(p.data)}</td><td>${p.hora}</td><td><span class="pill ${prevClass(prevStatus(p))}">${prevLabel(prevStatus(p))}</span></td></tr>`}).join('')}</tbody></table>`}

function addDays(dateStr,days){let dt=new Date(dateStr+'T12:00:00');dt.setDate(dt.getDate()+Number(days||0));return dt.toISOString().slice(0,10)}
function prevStatus(p){let t=new Date().toISOString().slice(0,10);if(p.status==='CONCLUIDA')return 'CONCLUIDA';if(p.status==='EM_EXECUCAO')return 'EM_EXECUCAO';if(p.data&&p.data<t)return 'ATRASADA';return p.status||'AGENDADA'}
function prevLabel(s){return {AGENDADA:'Programada',EM_EXECUCAO:'Em execução',CONCLUIDA:'Concluída',ATRASADA:'Atrasada'}[s]||s}
function prevClass(s){return {AGENDADA:'bg-blue-50 text-blue-700',EM_EXECUCAO:'bg-orange-50 text-orange-700',CONCLUIDA:'bg-green-50 text-green-700',ATRASADA:'bg-red-50 text-red-700'}[s]||'bg-slate-50 text-slate-700'}
function custoTotal(o){return Number(o.custo||0)+Number(o.custo_material||0)+Number(o.custo_terceiro||0)+Number(o.custo_interno||0)}
function eqCusto(id){return load().ordens.filter(o=>o.equipamento_id==id).reduce((s,o)=>s+custoTotal(o),0)}
function eqUltima(id){let l=load().ordens.filter(o=>o.equipamento_id==id).sort((a,b)=>(b.data||'').localeCompare(a.data||''));return l[0]?.data||''}
function eqProxPrev(id){let l=load().preventivas.filter(p=>p.equipamento_id==id&&prevStatus(p)!=='CONCLUIDA').sort((a,b)=>(a.data||'').localeCompare(b.data||''));return l[0]?.data||''}
function miniKpi(label,value){return `<div class="bg-slate-50 rounded-xl p-3"><div class="text-[10px] uppercase font-black text-slate-400">${label}</div><div class="font-black text-primary mt-1">${value}</div></div>`}
function fmtDate(x){if(!x)return'';let a=x.split('-');return a.length==3?`${a[2]}/${a[1]}/${a[0]}`:x}
function equipamentos(){let d=load(),r=rowsStore(d.equipamentos);return `<div class="flex justify-between mb-5"><div><h2 class="text-2xl font-black">Equipamentos</h2><p class="text-slate-500">Cadastro técnico por loja, setor e área.</p></div>${canAdmin()?'<button onclick="openEquip()" class="btn btn-primary">+ Novo Equipamento</button>':''}</div>${!canAdmin()?guard():''}<div class="card p-5 overflow-x-auto mt-5"><table class="w-full text-sm"><thead><tr class="text-left text-slate-500 border-b"><th class="py-3">TAG</th><th>Nome</th><th>Loja</th><th>Setor</th><th>Área</th><th>Fabricante</th><th>Nº Patrimonial</th><th>Nº Série</th><th>Status</th><th>Ações</th></tr></thead><tbody>${r.map(e=>`<tr class="border-b"><td class="py-3 font-black">${e.tag}</td><td>${e.nome}</td><td>${nomeLoja(e.loja_id)}</td><td>${nomeSetor(e.setor_id)}</td><td>${nomeArea(e.area_id)}</td><td>${e.fabricante}</td><td>${e.numero_patrimonial||''}</td><td>${e.numero_serie||''}</td><td><span class="pill bg-green-50 text-green-700">${e.status}</span></td><td><button onclick="openEquip360('${e.id}')" class="text-blue-700 font-black mr-3">360º</button>${canAdmin()?`<button onclick="openEquip('${e.id}')" class="text-orange-700 font-black">Editar</button>`:''}</td></tr>`).join('')}</tbody></table></div>`}
function openEquip360(id){let d=load(),e=d.equipamentos.find(x=>x.id==id);if(!e)return;let os=d.ordens.filter(o=>o.equipamento_id==id).sort((a,b)=>(b.data||'').localeCompare(a.data||''));let prev=d.preventivas.filter(p=>p.equipamento_id==id).sort((a,b)=>(b.data||'').localeCompare(a.data||''));modal('Equipamento 360º',`<div class="space-y-5"><div class="grid grid-cols-1 md:grid-cols-3 gap-4"><div class="md:col-span-2"><h2 class="text-2xl font-black text-primary">${e.nome}</h2><p class="text-slate-500">${e.tag} • ${nomeLoja(e.loja_id)} • ${nomeSetor(e.setor_id)} • ${nomeArea(e.area_id)}</p></div><div class="text-right"><span class="pill bg-blue-50 text-blue-700">${e.status}</span><span class="pill bg-orange-50 text-orange-700 ml-2">${e.criticidade}</span></div></div><div class="grid grid-cols-1 md:grid-cols-5 gap-3">${miniKpi('OS',os.length)}${miniKpi('Custo acumulado',money(eqCusto(id)))}${miniKpi('Última manutenção',eqUltima(id)?fmtDate(eqUltima(id)):'Sem registro')}${miniKpi('Próxima preventiva',eqProxPrev(id)?fmtDate(eqProxPrev(id)):'Não agendada')}${miniKpi('Disponibilidade',e.status==='PARADO'?'0%':'98%')}</div><div class="grid grid-cols-1 md:grid-cols-2 gap-5"><div class="card p-4 shadow-none"><h3 class="font-black text-primary mb-3">Ficha técnica</h3><div class="text-sm space-y-2"><div><b>Fabricante:</b> ${e.fabricante||'-'}</div><div><b>Modelo:</b> ${e.modelo||'-'}</div><div><b>Nº patrimonial:</b> ${e.numero_patrimonial||'-'}</div><div><b>Nº série:</b> ${e.numero_serie||'-'}</div><div><b>Instalação:</b> ${fmtDate(e.data_instalacao)||'-'}</div><div><b>Garantia:</b> ${fmtDate(e.data_garantia)||'-'}</div></div></div><div class="card p-4 shadow-none"><h3 class="font-black text-primary mb-3">Manutenção preventiva</h3><div class="text-sm space-y-2"><div><b>Frequência:</b> ${e.frequencia_preventiva||30} dias</div><div><b>Checklist padrão:</b><br>${e.checklist_padrao||'Sem checklist.'}</div><div><b>Observações:</b><br>${e.observacoes||'-'}</div></div></div></div><div><div class="flex gap-2 mb-4"><button class="tab-btn active" onclick="showEquipTab('hist-os')">Histórico de OS</button><button class="tab-btn" onclick="showEquipTab('hist-prev')">Preventivas</button><button class="tab-btn" onclick="showEquipTab('hist-fotos')">Fotos/Anexos</button></div><div id="hist-os" class="equip-tab">${histOS(os)}</div><div id="hist-prev" class="equip-tab hidden">${histPrev(prev)}</div><div id="hist-fotos" class="equip-tab hidden">${histFotos(os)}</div></div></div>`)}
function showEquipTab(id){document.querySelectorAll('.equip-tab').forEach(e=>e.classList.add('hidden'));document.getElementById(id)?.classList.remove('hidden');document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));event.target.classList.add('active')}
function histOS(l){return l.length?l.map(o=>`<div class="timeline-item"><b>${fmtDate(o.data)} • ${statusLabel(o.status)}</b><p class="text-sm text-slate-600">${o.descricao}</p><p class="text-xs text-slate-500">Tipo: ${o.tipo} • Prioridade: ${o.prioridade} • Custo: ${money(custoTotal(o))}</p></div>`).join(''):`<p class="text-slate-500">Nenhuma OS registrada.</p>`}
function histPrev(l){return l.length?l.map(p=>`<div class="timeline-item"><b>${fmtDate(p.data)} ${p.hora||''} • ${prevLabel(prevStatus(p))}</b><p class="text-sm text-slate-600">${p.atividade}</p></div>`).join(''):`<p class="text-slate-500">Nenhuma preventiva registrada.</p>`}
function histFotos(l){let a=l.filter(o=>o.anexo_nome);return a.length?a.map(o=>`<div class="border rounded-xl p-3 mb-3"><b>${o.anexo_nome}</b><p class="text-xs text-slate-500">${o.anexo_tipo}</p>${o.anexo_preview?`<img src="${o.anexo_preview}" class="mt-2 max-h-40 rounded-lg border">`:''}</div>`).join(''):`<p class="text-slate-500">Nenhum anexo registrado.</p>`}
function openEquip(id=null){if(!canAdmin())return alert('Apenas ADMIN e DIRETOR.');let d=load(),e=id?d.equipamentos.find(x=>x.id==id):{};modal(id?'Editar Equipamento':'Novo Equipamento',`<form id="equipForm" class="grid grid-cols-1 md:grid-cols-3 gap-4"><div><label class="label">Loja</label><select class="input" name="loja_id">${d.lojas.map(l=>`<option value="${l.id}" ${(e.loja_id||store())==l.id?'selected':''}>${l.nome}</option>`).join('')}</select></div><div><label class="label">Nome</label><input class="input" name="nome" value="${e.nome||''}" required></div><div><label class="label">TAG</label><input class="input" name="tag" value="${e.tag||'AUTO-EQ'}" required></div><div><label class="label">Setor</label><select class="input" name="setor_id">${d.setores.map(s=>`<option value="${s.id}" ${e.setor_id==s.id?'selected':''}>${s.nome}</option>`).join('')}</select></div><div><label class="label">Área</label><select class="input" name="area_id">${d.areas.map(a=>`<option value="${a.id}" ${e.area_id==a.id?'selected':''}>${a.nome}</option>`).join('')}</select></div><div><label class="label">Fabricante</label><input class="input" name="fabricante" value="${e.fabricante||''}"></div><div><label class="label">Modelo</label><input class="input" name="modelo" value="${e.modelo||''}"></div><div><label class="label">Número patrimonial</label><input class="input" name="numero_patrimonial" value="${e.numero_patrimonial||''}"></div><div><label class="label">Número de série</label><input class="input" name="numero_serie" value="${e.numero_serie||''}"></div><div><label class="label">Criticidade</label><select class="input" name="criticidade">${['BAIXA','MEDIA','ALTA','CRITICA'].map(x=>`<option ${e.criticidade==x?'selected':''}>${x}</option>`).join('')}</select></div><div><label class="label">Data instalação</label><input class="input" type="date" name="data_instalacao" value="${e.data_instalacao||''}"></div><div><label class="label">Data garantia</label><input class="input" type="date" name="data_garantia" value="${e.data_garantia||''}"></div><div><label class="label">Status</label><select class="input" name="status">${['OPERACIONAL','EM_MANUTENCAO','PARADO','AGUARDANDO_PECA'].map(x=>`<option ${e.status==x?'selected':''}>${x}</option>`).join('')}</select></div><div><label class="label">Frequência preventiva</label><input class="input" type="number" name="frequencia_preventiva" value="${e.frequencia_preventiva||30}"></div><div class="md:col-span-3"><label class="label">Checklist padrão</label><textarea class="input" name="checklist_padrao">${e.checklist_padrao||''}</textarea></div><div class="md:col-span-3"><label class="label">Observações</label><textarea class="input" name="observacoes">${e.observacoes||''}</textarea></div><div class="md:col-span-3 text-right"><button class="btn btn-primary">Salvar</button></div></form>`);equipForm.onsubmit=ev=>{ev.preventDefault();let d=load(),o=fobj(ev.target);if(id){let i=d.equipamentos.findIndex(x=>x.id==id);d.equipamentos[i]={...d.equipamentos[i],...o}}else d.equipamentos.push({id:uid('eq'),...o});save(d);closeModal();show('equipamentos')}}
function preventivas(){let d=load(),r=rowsStore(d.preventivas).map(p=>({...p,computedStatus:prevStatus(p)}));let total=r.length,conc=r.filter(p=>p.computedStatus==='CONCLUIDA').length,atr=r.filter(p=>p.computedStatus==='ATRASADA').length;let exec=total?Math.round((conc/total)*100):0, atras=total?Math.round((atr/total)*100):0;return `<div class="flex justify-between mb-5"><div><h2 class="text-2xl font-black">Preventivas Profissionais</h2><p class="text-slate-500">Cronograma recorrente, checklist e execução com geração de OS preventiva.</p></div>${canAdmin()?'<button onclick="openPrev()" class="btn btn-primary">+ Nova Preventiva</button>':''}</div><div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-5">${kpi('▣','Programadas',r.filter(p=>p.computedStatus==='AGENDADA').length,'No cronograma','#0757d8')}${kpi('⚒','Em execução',r.filter(p=>p.computedStatus==='EM_EXECUCAO').length,'Em andamento','#ff7a00')}${kpi('✓','Executadas',exec+'%','Concluídas','#23a047')}${kpi('!','Atrasadas',atras+'%','Fora do prazo','#e63125')}</div><div class="grid grid-cols-1 xl:grid-cols-3 gap-5"><div class="card p-5 xl:col-span-2"><h3 class="font-black text-primary mb-4">Calendário de Preventivas</h3>${calendar()}</div><div class="card p-5"><h3 class="font-black text-primary mb-4">Próximas Preventivas</h3>${r.sort((a,b)=>(a.data||'').localeCompare(b.data||'')).map(p=>`<div class="border-b py-3"><div class="flex justify-between gap-2"><b>${fmtDate(p.data)} ${p.hora||''}</b><span class="pill ${prevClass(p.computedStatus)}">${prevLabel(p.computedStatus)}</span></div><p class="font-black">${eqNome(p.equipamento_id)}</p><p class="text-xs text-slate-500">${p.atividade} • Recorrência: ${p.recorrencia_dias||30} dias</p><button onclick="executarPrev('${p.id}')" class="btn btn-outline-green mt-3 w-full">Executar Preventiva</button><button onclick="concluirPrev('${p.id}')" class="btn btn-outline-blue mt-2 w-full">Concluir e Reprogramar</button></div>`).join('')||'Nenhuma preventiva.'}</div></div>`}
function openPrev(){if(!canAdmin())return alert('Apenas ADMIN e DIRETOR.');let d=load(),eqs=rowsStore(d.equipamentos);modal('Nova Preventiva Profissional',`<form id="prevForm" class="grid grid-cols-1 md:grid-cols-2 gap-4"><div><label class="label">Equipamento</label><select class="input" name="equipamento_id">${eqs.map(e=>`<option value="${e.id}">${e.nome}</option>`).join('')}</select></div><div><label class="label">Atividade</label><input class="input" name="atividade" value="Manutenção Preventiva"></div><div><label class="label">Recorrência</label><select class="input" name="recorrencia_dias"><option value="7">7 dias</option><option value="15">15 dias</option><option value="30" selected>30 dias</option><option value="60">60 dias</option><option value="90">90 dias</option><option value="180">180 dias</option></select></div><div><label class="label">Data programada</label><input class="input" type="date" name="data" required></div><div><label class="label">Hora</label><input class="input" type="time" name="hora" value="09:00"></div><div><label class="label">Status</label><select class="input" name="status"><option value="AGENDADA">Programada</option><option value="EM_EXECUCAO">Em execução</option><option value="CONCLUIDA">Concluída</option><option value="ATRASADA">Atrasada</option></select></div><div><label class="label">Tipo de execução</label><select class="input" name="tipo_execucao"><option value="INTERNA">Equipe interna</option><option value="TERCEIRIZADA">Terceirizada</option></select></div><div><label class="label">Empresa responsável</label><input class="input" name="empresa_responsavel" placeholder="Ex: empresa terceirizada ou equipe interna"></div><div><label class="label">Custo extra</label><input class="input" type="number" step="0.01" name="custo_extra" value="0"></div><div class="md:col-span-2"><label class="label">Checklist da preventiva</label><textarea class="input" name="checklist" placeholder="Ex: verificar limpeza, ruído, temperatura, vedação e segurança."></textarea></div><div class="md:col-span-2 text-right"><button class="btn btn-primary">Salvar Preventiva</button></div></form>`);prevForm.onsubmit=ev=>{ev.preventDefault();let o=fobj(ev.target),e=eq(o.equipamento_id),d=load();d.preventivas.push({id:uid('prev'),loja_id:e.loja_id,historico:[],...o});save(d);closeModal();show('preventivas')}}
function executarPrev(id){let d=load(),p=d.preventivas.find(x=>x.id==id);if(!p)return;let e=eq(p.equipamento_id),osid=uid('os');p.status='EM_EXECUCAO';p.historico=p.historico||[];p.historico.push({data:new Date().toISOString().slice(0,10),acao:'Execução iniciada',os_id:osid});d.ordens.push({id:osid,loja_id:p.loja_id,equipamento_id:p.equipamento_id,status:'EM_EXECUCAO',tipo:'PREVENTIVA',prioridade:e?.criticidade||'MEDIA',descricao:`Execução de preventiva: ${p.atividade}. Empresa: ${p.empresa_responsavel||'Equipe interna'}. Checklist: ${p.checklist||e?.checklist_padrao||''}`,data:new Date().toISOString().slice(0,10),custo:0,custo_material:0,custo_terceiro:Number(p.custo_extra||0),custo_interno:0});save(d);alert('OS preventiva gerada.');show('os')}
function concluirPrev(id){let d=load(),p=d.preventivas.find(x=>x.id==id);if(!p)return;p.status='CONCLUIDA';p.historico=p.historico||[];p.historico.push({data:new Date().toISOString().slice(0,10),acao:'Preventiva concluída'});if(p.recorrencia_dias&&p.data)d.preventivas.push({...p,id:uid('prev'),data:addDays(p.data,p.recorrencia_dias),status:'AGENDADA',historico:[]});save(d);show('preventivas')}
function statusOptions(selected='ABERTA'){
 const sts=['ABERTA','EM_EXECUCAO','AGUARDANDO_PECA','AGUARDANDO_TERCEIRIZADA','AGUARDANDO_APROVACAO','CONCLUIDA'];
 return sts.map(s=>`<option value="${s}" ${selected===s?'selected':''}>${statusLabel(s)}</option>`).join('')
}
function statusLabel(s){
 return {ABERTA:'Aberta',EM_EXECUCAO:'Em execução',AGUARDANDO_PECA:'Aguardando peça',AGUARDANDO_TERCEIRIZADA:'Aguardando terceirizada',AGUARDANDO_APROVACAO:'Aguardando aprovação',CONCLUIDA:'Concluída'}[s] || s
}
function statusPillClass(s){
 return {ABERTA:'bg-blue-50 text-blue-700',EM_EXECUCAO:'bg-orange-50 text-orange-700',AGUARDANDO_PECA:'bg-purple-50 text-purple-700',AGUARDANDO_TERCEIRIZADA:'bg-yellow-50 text-yellow-700',AGUARDANDO_APROVACAO:'bg-red-50 text-red-700',CONCLUIDA:'bg-green-50 text-green-700'}[s] || 'bg-slate-50 text-slate-700'
}
function os(){
 let r=rowsStore(load().ordens);
 return `<div class="flex justify-between mb-5"><div><h2 class="text-2xl font-black">Ordens de Serviço</h2><p class="text-slate-500">Abertura, anexos, acompanhamento e status das OS.</p></div><button onclick="openOS()" class="btn btn-primary">+ Nova OS</button></div>
 <div class="grid grid-cols-1 xl:grid-cols-3 gap-4">${r.map(o=>`
  <div class="card p-5">
    <div class="flex justify-between gap-3">
      <div>
        <div class="text-xs font-black text-slate-400">${o.tipo}</div>
        <h3 class="font-black">${eqNome(o.equipamento_id)}</h3>
      </div>
      <span class="pill ${statusPillClass(o.status)}">${statusLabel(o.status)}</span>
    </div>

    ${o.anexo_nome?`<div class="rounded-xl border bg-slate-50 p-3 mb-3 text-xs"><b>Anexo:</b> ${o.anexo_nome}<br><span class="text-slate-500">${o.anexo_tipo||''}</span>${o.anexo_preview?`<img src="${o.anexo_preview}" class="mt-2 max-h-32 rounded-lg border">`:''}</div>`:''}
    <div class="text-xs"><b>Prioridade:</b> ${o.prioridade} • <b>Custo:</b> ${money(custoTotal(o))}</div>
    <div class="mt-4">
      <label class="label">Alterar status</label>
      <div class="flex gap-2">
        <select class="input" id="status_${o.id}">${statusOptions(o.status)}</select>
        <button onclick="updateOSStatus('${o.id}')" class="btn btn-orange">Salvar</button>
      </div>
    </div>
  </div>`).join('')}</div>`
}
function updateOSStatus(id){
 let d=load(), item=d.ordens.find(o=>o.id===id);
 if(!item)return;
 item.status=document.getElementById('status_'+id).value;
 save(d); show('os')
}
function readAnexo(file){
 return new Promise(resolve=>{
  if(!file) return resolve(null);
  const base={nome:file.name,tipo:file.type,tamanho:file.size,preview:''};
  if(file.type.startsWith('image/')){
    const reader=new FileReader();
    reader.onload=()=>resolve({...base,preview:reader.result});
    reader.readAsDataURL(file);
  } else {
    resolve(base);
  }
 })
}
function openOS(){
 let d=load(),eqs=rowsStore(d.equipamentos);
 modal('Nova Ordem de Serviço - Foto/Vídeo e Status Completo',`<form id="osForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
  <div><label class="label">Equipamento</label><select class="input" name="equipamento_id">${eqs.map(e=>`<option value="${e.id}">${e.nome}</option>`).join('')}</select></div>
  <div><label class="label">Tipo</label><select class="input" name="tipo"><option>CORRETIVA</option><option>PREVENTIVA</option><option>AUDITORIA</option></select></div>
  <div><label class="label">Prioridade</label><select class="input" name="prioridade"><option>BAIXA</option><option>MEDIA</option><option>ALTA</option><option>CRITICA</option></select></div>
  <div><label class="label">Status inicial</label><select class="input" name="status">${statusOptions('ABERTA')}</select></div>
  <div><label class="label">Custo material</label><input class="input" type="number" step="0.01" name="custo_material" value="0"></div>
  <div><label class="label">Serviço terceiro</label><input class="input" type="number" step="0.01" name="custo_terceiro" value="0"></div>
  <div><label class="label">Mão de obra interna</label><input class="input" type="number" step="0.01" name="custo_interno" value="0"></div>
  <div class="md:col-span-2 rounded-xl border-2 border-orange-300 bg-orange-50 p-4"><label class="label text-orange-700">Foto ou vídeo do problema</label><input class="input bg-white" type="file" name="anexo" accept="image/*,video/*"><p class="text-xs text-orange-700 mt-2 font-bold">Campo novo: anexe foto ou vídeo da ocorrência.</p></div>
  <div class="md:col-span-2"><label class="label">Descrição</label><textarea class="input" name="descricao" required placeholder="Descreva o problema, local e impacto na operação."></textarea></div>
  <div class="md:col-span-2 text-right"><button class="btn btn-primary">Abrir OS</button></div>
 </form>`);
 osForm.onsubmit=async ev=>{
  ev.preventDefault();
  let o=fobj(ev.target),e=eq(o.equipamento_id),d=load();
  const file=ev.target.anexo.files[0];
  const anexo=await readAnexo(file);
  d.ordens.push({id:uid('os'),loja_id:e.loja_id,data:new Date().toISOString().slice(0,10),custo:0,...o,anexo_nome:anexo?.nome||'',anexo_tipo:anexo?.tipo||'',anexo_tamanho:anexo?.tamanho||0,anexo_preview:anexo?.preview||''});
  save(d);closeModal();show('os')
 }
}
function adminTable(title, rows, cols, btn){return `<div class="flex justify-between mb-5"><div><h2 class="text-2xl font-black">${title}</h2><p class="text-slate-500">Gestão administrativa.</p></div>${btn||''}</div>${!canAdmin()?guard():''}<div class="card p-5 overflow-x-auto mt-5"><table class="w-full text-sm"><thead><tr class="text-left border-b text-slate-500">${cols.map(c=>`<th class="py-3">${c[0]}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr class="border-b">${cols.map(c=>`<td class="py-3">${typeof c[1]=='function'?c[1](r):r[c[1]]}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}function lojas(){return adminTable('Lojas (Unidades)',load().lojas,[['Nome','nome'],['Status',r=>'Ativa']],null)}function setores(){let b=canAdmin()?'<button onclick="openSetor()" class="btn btn-primary">+ Novo</button>':'';return adminTable('Setores',load().setores,[['Nome','nome'],['Ações',r=>canAdmin()?`<button onclick="openSetor('${r.id}')" class="text-blue-700 font-black">Editar</button>`:'Visualizar']],b)}function openSetor(id=null){if(!canAdmin())return alert('Apenas ADMIN e DIRETOR.');let d=load(),s=id?d.setores.find(x=>x.id==id):{};modal(id?'Editar Setor':'Novo Setor',`<form id="setForm"><label class="label">Nome do setor</label><input class="input mb-4" name="nome" value="${s.nome||''}" required><div class="text-right"><button class="btn btn-primary">Salvar</button></div></form>`);setForm.onsubmit=ev=>{ev.preventDefault();let o=fobj(ev.target),d=load();if(id)d.setores[d.setores.findIndex(x=>x.id==id)]={...s,...o};else d.setores.push({id:uid('set'),...o});save(d);closeModal();show('setores')}}function areas(){let b=canAdmin()?'<button onclick="openArea()" class="btn btn-primary">+ Novo</button>':'';return adminTable('Áreas',load().areas,[['Área','nome'],['Setor',r=>nomeSetor(r.setor_id)],['Ações',r=>canAdmin()?`<button onclick="openArea('${r.id}')" class="text-blue-700 font-black">Editar</button>`:'Visualizar']],b)}function openArea(id=null){if(!canAdmin())return alert('Apenas ADMIN e DIRETOR.');let d=load(),a=id?d.areas.find(x=>x.id==id):{};modal(id?'Editar Área':'Nova Área',`<form id="areaForm" class="grid grid-cols-1 md:grid-cols-2 gap-4"><div><label class="label">Nome da área</label><input class="input" name="nome" value="${a.nome||''}" required></div><div><label class="label">Setor</label><select class="input" name="setor_id">${d.setores.map(s=>`<option value="${s.id}" ${a.setor_id==s.id?'selected':''}>${s.nome}</option>`).join('')}</select></div><div class="md:col-span-2 text-right"><button class="btn btn-primary">Salvar</button></div></form>`);areaForm.onsubmit=ev=>{ev.preventDefault();let o=fobj(ev.target),d=load();if(id)d.areas[d.areas.findIndex(x=>x.id==id)]={...a,...o};else d.areas.push({id:uid('area'),...o});save(d);closeModal();show('areas')}}function usuarios(){
 let d=load();
 let btn=canAdmin()?`<button onclick="openUser()" class="btn btn-primary">+ Novo Usuário</button>`:'';
 return adminTable('Usuários',d.usuarios,[['Nome','nome'],['Perfil','role'],['Loja',r=>nomeLoja(r.loja_id)],['Status',r=>r.ativo?'Ativo':'Inativo']],btn)
}

 let d=load();
 modal('Novo Usuário',`<form id="userForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
  <div><label class="label">Nome</label><input class="input" name="nome" required></div>

 userForm.onsubmit=e=>{

 }
}function permissoes(){return `<h2 class="text-2xl font-black mb-5">Permissões</h2><div class="card p-5 overflow-x-auto"><table class="w-full text-sm"><thead><tr class="text-left border-b"><th class="py-3">Perfil</th><th>Abrir OS</th><th>Visualizar</th><th>Cadastrar Equipamentos</th><th>Setores/Áreas</th><th>Branding</th></tr></thead><tbody>${roles.map(r=>`<tr class="border-b"><td class="py-3 font-black">${r}</td><td>Sim</td><td>Sim</td><td>${adminRoles.includes(r)?'Sim':'Não'}</td><td>${adminRoles.includes(r)?'Sim':'Não'}</td><td>${r=='ADMIN'?'Sim':'Não'}</td></tr>`).join('')}</tbody></table></div>`}function custos(){let os=rowsStore(load().ordens),total=os.reduce((s,o)=>s+custoTotal(o),0);return `<h2 class="text-2xl font-black mb-5">Custos</h2><div class="card p-5"><div class="text-slate-500 font-black uppercase text-xs">Custo da loja</div><div class="text-4xl font-black mt-2">${money(total)}</div></div>`}function auditoria(){return '<h2 class="text-2xl font-black mb-5">Auditoria</h2><div class="card p-8">Próxima etapa: abertura de OS por auditoria, foto obrigatória e meta mínima de 5 auditorias por semana.</div>'}function relatorios(){return '<h2 class="text-2xl font-black mb-5">Relatórios</h2><div class="card p-8">Relatórios de OS, custos, preventivas e auditorias serão adicionados após finalizar OS e preventivas.</div>'}function config(){return `<h2 class="text-2xl font-black mb-5">Configurações</h2>${!canAdmin()?guard():''}<div class="card p-5 mt-5"><h3 class="font-black mb-4">Dados locais</h3><button onclick="reset()" class="btn bg-red-600 text-white">Resetar dados de teste</button></div>`}function reset(){if(confirm('Resetar dados locais?')){localStorage.setItem(KEY,JSON.stringify(seed));location.reload()}}
window.currentPage='dashboard'; if(location.hash) location.hash=''; render();
